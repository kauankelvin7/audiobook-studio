Review the implemented change independently. Inspect correctness, invalid states, retries, recovery, cache invalidation, concurrency, accessibility, and missing tests. Run bounded relevant checks when possible. Do not edit. Return RESULT with Evidence, Findings, Files inspected, Risks, Recommendation, Tests/commands actually run, and Unknowns.
"""
